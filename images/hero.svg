<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t">
  <title id="t">社員と面談する産業医のイラスト</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef7f6"/><stop offset="1" stop-color="#dff0ed"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d6ece8"/>
    </linearGradient>
  </defs>

  <!-- room -->
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect x="470" y="40" width="270" height="230" rx="10" fill="#ffffff"/>
  <rect x="482" y="52" width="246" height="206" rx="6" fill="url(#win)"/>
  <rect x="603" y="52" width="4" height="206" fill="#ffffff"/>
  <rect x="482" y="153" width="246" height="4" fill="#ffffff"/>
  <!-- shelf -->
  <rect x="40" y="120" width="230" height="10" rx="3" fill="#c9d9d6"/>
  <rect x="58" y="70" width="18" height="50" rx="3" fill="#4fc4b0"/>
  <rect x="80" y="62" width="16" height="58" rx="3" fill="#1c2a40"/>
  <rect x="100" y="76" width="20" height="44" rx="3" fill="#9fd9ce"/>
  <rect x="124" y="66" width="14" height="54" rx="3" fill="#5a6577"/>
  <!-- plant -->
  <path d="M205 120c-6-30 4-48 14-56-2 18 2 34-4 56z" fill="#4fc4b0"/>
  <path d="M215 120c10-26 28-34 40-34-12 12-20 24-30 34z" fill="#2a9d8a"/>
  <path d="M200 120c-14-18-30-20-40-18 12 8 22 14 30 18z" fill="#2a9d8a"/>
  <rect x="196" y="104" width="30" height="16" rx="4" fill="#ffffff"/>
  <!-- floor -->
  <rect x="0" y="470" width="800" height="130" fill="#d3e8e4"/>

  <!-- data card (floating) -->
  <g transform="translate(330 70)">
    <rect width="150" height="104" rx="14" fill="#ffffff"/>
    <rect x="16" y="16" width="64" height="8" rx="4" fill="#1c2a40"/>
    <rect x="22" y="70" width="14" height="18" rx="3" fill="#bfece4"/>
    <rect x="44" y="58" width="14" height="30" rx="3" fill="#9fd9ce"/>
    <rect x="66" y="46" width="14" height="42" rx="3" fill="#4fc4b0"/>
    <rect x="88" y="62" width="14" height="26" rx="3" fill="#9fd9ce"/>
    <rect x="110" y="36" width="14" height="52" rx="3" fill="#2a9d8a"/>
    <circle cx="117" cy="24" r="6" fill="#f08a5d"/>
  </g>

  <!-- doctor's chair -->
  <rect x="470" y="236" width="150" height="200" rx="34" fill="#1c2a40"/>

  <!-- doctor -->
  <g>
    <!-- coat body -->
    <path d="M462 410c0-62 12-106 78-112 66 6 78 50 78 112z" fill="#ffffff"/>
    <path d="M462 410c0-62 12-106 78-112 66 6 78 50 78 112z" fill="none" stroke="#dbe3ea" stroke-width="2"/>
    <!-- shirt -->
    <path d="M520 300l20 54 20-54c-6-2-13-3-20-3s-14 1-20 3z" fill="#5b86b8"/>
    <!-- lapels -->
    <path d="M520 300l20 54-30-22 6-34z" fill="#eef2f6"/>
    <path d="M560 300l-20 54 30-22-6-34z" fill="#eef2f6"/>
    <!-- neck -->
    <rect x="528" y="270" width="24" height="32" rx="10" fill="#f2c9a8"/>
    <!-- stethoscope -->
    <path d="M522 302c-8 30-6 54 12 62" fill="none" stroke="#5a6577" stroke-width="4" stroke-linecap="round"/>
    <path d="M558 302c8 30 6 54-12 62" fill="none" stroke="#5a6577" stroke-width="4" stroke-linecap="round"/>
    <circle cx="540" cy="368" r="8" fill="#5a6577"/>
    <circle cx="540" cy="368" r="4" fill="#c9d1da"/>
    <!-- pocket & badge -->
    <rect x="574" y="346" width="26" height="4" rx="2" fill="#dbe3ea"/>
    <rect x="578" y="336" width="6" height="12" rx="2" fill="#4fc4b0"/>
    <!-- head -->
    <ellipse cx="497" cy="240" rx="7" ry="10" fill="#e8b994"/>
    <ellipse cx="583" cy="240" rx="7" ry="10" fill="#e8b994"/>
    <ellipse cx="540" cy="236" rx="42" ry="46" fill="#f2c9a8"/>
    <path d="M497 232c-4-40 20-62 46-62 30 0 46 22 42 58-8-18-22-30-44-32-16 10-30 18-44 36z" fill="#1b2433"/>
    <!-- face -->
    <path d="M516 236q7-5 14 0" fill="none" stroke="#1b2433" stroke-width="3" stroke-linecap="round"/>
    <path d="M550 236q7-5 14 0" fill="none" stroke="#1b2433" stroke-width="3" stroke-linecap="round"/>
    <path d="M524 258q16 14 32 0" fill="none" stroke="#b5654a" stroke-width="3.5" stroke-linecap="round"/>
    <ellipse cx="514" cy="252" rx="7" ry="4" fill="#f5a99a" opacity=".5"/>
    <ellipse cx="566" cy="252" rx="7" ry="4" fill="#f5a99a" opacity=".5"/>
  </g>

  <!-- employee's chair -->
  <rect x="120" y="300" width="40" height="150" rx="16" fill="#9aa8b8"/>

  <!-- employee (seen from side/back, facing right) -->
  <g>
    <path d="M150 420c-4-70 14-112 80-116 54 4 70 46 66 116z" fill="#1c2a40"/>
    <!-- collar -->
    <path d="M232 304l-16 26 22-6 10 6-6-24z" fill="#ffffff"/>
    <rect x="222" y="276" width="22" height="30" rx="9" fill="#e8b994"/>
    <!-- head -->
    <ellipse cx="238" cy="244" rx="40" ry="44" fill="#f2c9a8"/>
    <path d="M198 248c-8-44 16-70 46-70 26 0 40 16 38 34-14-6-30-4-42 6-8 6-12 18-14 32-10-2-20 0-28-2z" fill="#3a2b22"/>
    <ellipse cx="226" cy="250" rx="8" ry="11" fill="#e8b994"/>
    <!-- face (profile) -->
    <path d="M258 240q6-4 12 0" fill="none" stroke="#1b2433" stroke-width="3" stroke-linecap="round"/>
    <path d="M260 262q8 6 14 0" fill="none" stroke="#b5654a" stroke-width="3" stroke-linecap="round"/>
    <!-- arm with pen -->
    <path d="M250 340c22 20 46 44 70 62l-14 14c-28-14-52-34-70-56z" fill="#16233a"/>
    <circle cx="318" cy="408" r="10" fill="#f2c9a8"/>
    <path d="M318 404l22-18" stroke="#1b2433" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- desk -->
  <rect x="120" y="402" width="600" height="20" rx="6" fill="#c8945f"/>
  <rect x="120" y="420" width="600" height="8" fill="#a97a4c"/>
  <rect x="150" y="428" width="14" height="96" fill="#a97a4c"/>
  <rect x="676" y="428" width="14" height="96" fill="#a97a4c"/>

  <!-- doctor's hands -->
  <ellipse cx="528" cy="398" rx="16" ry="10" fill="#f2c9a8"/>
  <ellipse cx="552" cy="398" rx="16" ry="10" fill="#e8b994"/>
  <path d="M470 380c10 10 26 16 44 18l-2 10c-22 0-40-6-52-14z" fill="#ffffff"/>
  <path d="M610 380c-10 10-26 16-44 18l2 10c22 0 40-6 52-14z" fill="#ffffff"/>

  <!-- notebook (employee) -->
  <path d="M290 398l70-6 6 10-70 6z" fill="#ffffff"/>
  <!-- clipboard -->
  <rect x="410" y="390" width="70" height="14" rx="3" fill="#eef2f6"/>
  <rect x="436" y="386" width="18" height="6" rx="2" fill="#8a97a8"/>
  <!-- laptop -->
  <path d="M600 330l80-8 6 72-80 8z" fill="#2b3648"/>
  <path d="M606 336l68-6 5 60-68 6z" fill="#e9f6f3"/>
  <polyline points="612,370 626,362 640,372 654,350 670,358" fill="none" stroke="#2a9d8a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M590 402l110-8 6 8-110 8z" fill="#8a97a8"/>
  <!-- glass of water -->
  <rect x="372" y="370" width="20" height="32" rx="4" fill="#ffffff" opacity=".75"/>
  <rect x="374" y="384" width="16" height="16" rx="3" fill="#bfe3f0" opacity=".9"/>

  <!-- speech bubbles -->
  <g transform="translate(300 170)">
    <rect width="96" height="56" rx="18" fill="#ffffff"/>
    <path d="M24 56l-6 18 22-18z" fill="#ffffff"/>
    <circle cx="30" cy="28" r="6" fill="#9fd9ce"/>
    <circle cx="48" cy="28" r="6" fill="#4fc4b0"/>
    <circle cx="66" cy="28" r="6" fill="#2a9d8a"/>
  </g>
  <g transform="translate(610 150)">
    <rect width="70" height="56" rx="18" fill="#4fc4b0"/>
    <path d="M14 56l-4 18 20-18z" fill="#4fc4b0"/>
    <path d="M35 42c-14-9-20-15-20-22a8 8 0 0 1 20-3 8 8 0 0 1 20 3c0 7-6 13-20 22z" fill="#ffffff"/>
  </g>
</svg>
